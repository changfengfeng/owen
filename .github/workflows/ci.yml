name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q -m 'not live and not integration'
      - run: node --check src/cloud_agent/static/app.js && node --test tests/frontend.test.cjs
