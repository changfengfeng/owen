[project]
name = "cloud-agent"
version = "0.1.0"
description = "A from-scratch multi-tenant cloud coding agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1", "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
cloud-agent = "cloud_agent.main:main"
cloud-agent-worker = "cloud_agent.worker:main"
cloud-agent-db = "cloud_agent.db:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a Docker daemon", "live: requires a real model key"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
